<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cornelia Studio</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>Cornelia Studio</h1>

    <div class="grid">
        <div class="card">
            <div>
                <label>Preset</label>
                <div class="select">
                    <input type="hidden" class="select-value" value="Default">
                    <div class="select-display">
                        <span class="selected"> Default</span>
                        <span class="arrow"></span>
                    </div>
                    <div class="options">
                        <div class="option" data-value="default"> Default</div>
                        <div class="option" data-value="water">󱢺 Water</div>
                        <div class="option" data-value="beach"> Beach</div>
                    </div>
                </div>
            </div>

            <div class="color-picker">
                <label>Base Color</label>
                <div class="color-wrapper">
                    <input type="color" value="#FFCA38" id="baseColor">
                    <div class="color-display"></div>
                </div>
            </div>

            <div class="color-picker">
                <label>Back Color</label>
                <div class="color-wrapper">
                    <input type="color" value="" data-empty="true" id="backColor">
                    <div class="color-display"></div>
                </div>
            </div>

            <div class="color-picker">
                <label>Icon Color</label>
                <div class="color-wrapper">
                    <input type="color" value="" data-empty="true" id="backColor">
                    <div class="color-display"></div>
                </div>
            </div>

            <div>
                <label>Center Icon</label>
                <input type="text" placeholder="">
            </div>

            <div>
                <label>Corner Icon</label>
                <input type="text" placeholder="">
            </div>

            <div>
                <label>Text</label>
                <input type="text" placeholder="1">
            </div>

            <div>
                <label>Saturation</label>
                <input type="range" min="0" max="200" value="100">
            </div>

            <div>
                <label>Brightness</label>
                <input type="range" min="0" max="200" value="100">
            </div>

            <div>
                <label>Contrast</label>
                <input type="range" min="0" max="200" value="100">
            </div>
        </div>

        <div class="preview">
            <div>
                <label>Style</label>
                <div class="select">
                    <input type="hidden" class="select-value" value="Default">
                    <div class="select-display">
                        <span class="selected">Shaded</span>
                        <span class="arrow"></span>
                    </div>
                    <div class="options">
                        <div class="option" data-value="shaded">Shaded</div>
                        <div class="option" data-value="outline">Outline</div>
                        <div class="option" data-value="flat">Flat</div>
                    </div>
                </div>
            </div>
                
            <div>
                <label>Varient</label>
                <div class="select">
                    <input type="hidden" class="select-value" value="Default">
                    <div class="select-display">
                        <span class="selected">Left 1</span>
                        <span class="arrow"></span>
                    </div>
                    <div class="options">
                        <div class="option" data-value="left1">Left 1</div>
                        <div class="option" data-value="left2">Left 2</div>
                        <div class="option" data-value="left3">Left 3</div>
                        <div class="option" data-value="center1">Center 1</div>
                        <div class="option" data-value="center2">Center 2</div>
                        <div class="option" data-value="center3">Center 3</div>
                        <div class="option" data-value="right1">Right 1</div>
                        <div class="option" data-value="right2">Right 2</div>
                        <div class="option" data-value="right3">Right 3</div>
                    </div>
                </div>
            </div>

            <div id="preview">
                <!-- SVG goes here -->
            </div>
        </div>
    </div>

    <div class="buttons">
        <button id="d_svg"><span class="icon">󰆓</span><span class="text">.SVG</span></button>
        <button id="d_png"><span class="icon">󰆓</span><span class="text">.PNG</span></button>
        <button id="d_ico"><span class="icon">󰆓</span><span class="text">.ICO</span></button>
        <button id="d_zip"><span class="icon">󰆓</span><span class="text">DOWNLOAD ALL (.ZIP)</span></button>
    </div>

    <div class="license">© 2026 <a href="https://avatarkage.com">AvatarKage</a>. All Rights Reserved.</div>

    <script src="./script.js"></script>
</body>
</html>
